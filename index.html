<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savant AI — AI 表格工作台</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

<aside class="sidebar">
    <div class="brand">
        <h1>Savant AI</h1>
        <p>智能表格助手</p>
    </div>

    <div class="card-module">
        <span class="section-label">数据源</span>

        <div class="drop-zone" id="dropZone">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
            </svg>

            <p style="font-size:14px;font-weight:600;">
                拖拽上传 Excel / CSV
            </p>

            <input type="file" id="fileInput" hidden accept=".xlsx,.xls,.csv">
        </div>

        <div id="fileStatus" style="display:none;margin-top:20px;">
            <div id="fileName"></div>
        </div>
    </div>

    <div class="card-module">
        <span class="section-label">当前工作表</span>
        <select id="sheetSelect"></select>
    </div>

    <div class="card-module">
        <span class="section-label">导出工具</span>

        <select id="columnSelect" style="margin-bottom:12px;">
            <option value="">选择拆分列...</option>
        </select>

        <button class="btn-forest" id="btnSplit">
            生成 ZIP
        </button>
    </div>

    <div style="margin-top:auto;">
        <span class="section-label">AI 服务</span>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <span style="font-size:15px;font-weight:700;color:#17212b;">硅基流动</span>
            <span style="font-size:13px;color:#525f6d;">已通过本地代理连接</span>
        </div>
    </div>
</aside>

<main class="main-content">

    <header class="chat-header">
        <h2>AI 表格工作台</h2>

        <div style="font-size:11px;color:#438a5e;font-weight:800;display:flex;align-items:center;gap:6px;">
            <span style="width:6px;height:6px;background:#438a5e;border-radius:50%;"></span>
            本地 AI 引擎已连接
        </div>
    </header>

    <div class="chat-messages" id="chatMessages">

        <div class="ai-analysis-card">
            <span class="ai-intent-tag">AI 表格助手已就绪</span>

            <div class="ai-section-content">
                上传 Excel 或 CSV 文件，然后用中文描述你想完成的表格任务。我可以帮你生成公式、理解表格结构，并辅助完成常见办公处理。
            </div>
        </div>

    </div>

    <div class="input-area">
        <div class="input-container">
            <input type="text" id="userInput" placeholder="用中文描述你想完成的表格任务…">
            <button id="btnSend">分析</button>
        </div>
    </div>

</main>

<section class="preview-pane">

    <div class="preview-header">
        <h3 id="activeSheetName">数据预览</h3>
        <p id="rowCount"></p>
    </div>

    <div class="table-wrap" id="tableContainer"></div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
```
